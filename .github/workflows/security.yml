name: Security gate

on:
  push:
    branches: [main, security-intelligence-v1.3.0]
  pull_request:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: PHP syntax
        run: |
          php -l wp-fortress-guard.php
          php -l includes/class-wpfg-security-intelligence.php
      - name: Reject high-risk PHP execution primitives
        run: |
          set -euo pipefail
          if grep -REn --include='*.php' -E '(eval|shell_exec|system|passthru|proc_open|popen|pcntl_exec)[[:space:]]*[(]' .; then
            echo "High-risk PHP execution primitive found."
            exit 1
          fi
      - name: Check intelligence security invariants
        run: |
          set -euo pipefail
          grep -F 'hash_hmac( '\''sha256'\'', $body, $secret )' tests/security-intelligence.php
          grep -F 'hash_equals( $expected, $signature )' includes/class-wpfg-security-intelligence.php
          grep -F "X-Wordfence-Signature" tests/security-intelligence.php
          grep -F "MAX_BODY_BYTES" includes/class-wpfg-security-intelligence.php
          grep -F "current_user_can( 'manage_options' )" includes/class-wpfg-security-intelligence.php
      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer:^3 dealerdirect/phpcodesniffer-composer-installer:^1 wp-coding-standards/wpcs:^3
      - name: WordPress security sniffs
        run: |
          ~/.composer/vendor/bin/phpcs --standard=WordPress --sniffs=WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.Security.EscapeOutput includes/class-wpfg-security-intelligence.php || true

  runtime-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli
      - name: Install latest WordPress and Fortress Guard
        run: |
          set -euo pipefail
          mkdir -p /tmp/wpfg-test
          wp core download --path=/tmp/wpfg-test --force
          wp config create --path=/tmp/wpfg-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/wpfg-test --url=http://localhost --title=FortressSecurity --admin_user=testadmin --admin_password='Strong-Test-Password-2026!' --admin_email=test@example.com --skip-email
          mkdir -p /tmp/wpfg-test/wp-content/plugins/wp-fortress-guard/includes
          cp wp-fortress-guard.php readme.txt /tmp/wpfg-test/wp-content/plugins/wp-fortress-guard/
          cp includes/class-wpfg-security-intelligence.php /tmp/wpfg-test/wp-content/plugins/wp-fortress-guard/includes/
          wp plugin activate wp-fortress-guard --path=/tmp/wpfg-test
      - name: Run security intelligence regression tests
        run: wp eval-file "$GITHUB_WORKSPACE/tests/security-intelligence.php" --path=/tmp/wpfg-test | grep wpfg-security-intelligence-ok
